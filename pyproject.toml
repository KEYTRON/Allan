[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allan"
version = "0.2.0"
description = "Allan - Neural Network Framework for Russian Language Processing"
readme = "README_RU.md"
requires-python = ">=3.9"
license = {text = "BSL-1.1"}
authors = [
    {name = "KEYTRON", email = "keytronprime@gmail.com"}
]
keywords = ["nlp", "russian", "machine-learning", "neural-networks", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "tokenizers>=0.14.0",
    "accelerate>=0.24.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.3.0",
    "psutil>=5.9.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
russian = [
    "pymorphy2[fast]>=0.9.1",
    "razdel>=0.5.0",
    "sentencepiece>=0.1.99",
]

colab = [
    "google-colab",
]

monitoring = [
    "wandb>=0.16.0",
    "tensorboard>=2.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "gpustat>=1.1.0",
]

optimization = [
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]

all = [
    "allan[russian,colab,monitoring,optimization,dev]",
]

[project.urls]
Homepage = "https://github.com/KEYTRON/Allan"
Repository = "https://github.com/KEYTRON/Allan"
Issues = "https://github.com/KEYTRON/Allan/issues"

[project.scripts]
allan = "allan.main:main"

[tool.setuptools]
packages = ["allan", "allan.datasets", "allan.optimization", "allan.colab", "allan.config", "allan.nlp"]

[tool.setuptools.package-dir]
allan = "src"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
